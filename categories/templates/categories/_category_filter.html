{% load i18n %}
<div class="tw-cat-filter" id="catFilter">
  <button type="button" class="tw-sort-btn tw-cat-filter-trigger" id="catFilterBtn"
          aria-expanded="false" aria-controls="catFilterPanel">
    <span id="catFilterLabel">{% if all_label %}{{ all_label }}{% else %}{% trans 'Category' %}{% endif %}</span>
    <i class="fas fa-chevron-down tw-cat-filter-chevron"></i>
  </button>
  <div class="tw-cat-filter-panel" id="catFilterPanel" hidden>
    <div class="tw-cat-filter-item tw-cat-filter-all" id="catAllRow" data-key="" data-label="{% trans 'All' %}">
      <i class="fas fa-check tw-cat-filter-check"></i>
      <span>{% trans 'All' %}</span>
    </div>
    {% for cat in categories %}
    <div class="tw-cat-filter-item" data-key="{% if key_attr == 'pk' %}{{ cat.pk }}{% else %}{{ cat.slug }}{% endif %}"
         data-label="{{ cat.name }}"
         {% if cat.description %}title="{{ cat.description }}"{% endif %}>
      <i class="fas fa-check tw-cat-filter-check"></i>
      <span>{{ cat.name }}</span>
    </div>
    {% endfor %}
    <div class="tw-cat-filter-manage-sep"></div>
    <button type="button" class="tw-cat-filter-manage-btn" id="catManageBtn">
      <i class="fas fa-gear"></i> {% if manage_label %}{{ manage_label }}{% else %}{% trans 'Manage categories' %}{% endif %}
    </button>
  </div>
</div>
