{% load i18n %}
<div class="tw-modal tw-fade" id="manageCategoriesModal" tabindex="-1" aria-labelledby="manageCategoriesModalLabel" aria-hidden="true">
  <div class="tw-modal-dialog tw-modal-dialog-scrollable">
    <div class="tw-modal-content">
      <div class="tw-modal-header">
        <h5 class="tw-modal-title" id="manageCategoriesModalLabel">
          <i class="fas fa-gear tw-me-2"></i>{% trans 'Manage categories' %}
        </h5>
        <button type="button" class="tw-btn-close" data-tw-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
      </div>
      <div class="tw-modal-body">
        <ul class="tw-cat-mgr-list" id="catMgrList"></ul>
        <div class="tw-cat-mgr-error tw-d-none" id="catMgrError"></div>
        <div class="tw-cat-mgr-add-row" id="catMgrAddRow">
          <input type="text" class="tw-cat-mgr-input" id="catMgrNewName" placeholder="{% trans 'Category name' %}" maxlength="100">
          <input type="text" class="tw-cat-mgr-input" id="catMgrNewDesc" placeholder="{% trans 'Description (optional)' %}">
          <button type="button" class="tw-btn tw-btn-sm tw-btn-primary" id="catMgrAddBtn">
            <i class="fas fa-plus fa-fw tw-me-1"></i>{% trans 'Add category' %}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
