name: Status Checks

on:
  push:
    branches:
      - main
      - ui
  pull_request:
    branches:
      - main
      - ui
  workflow_dispatch:

env:
  DEBUG: "True"
  SECRET_KEY: "ci-secret-key-for-status-checks"
  LOGGING_DESTINATION: "console"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  REDIS_HOST: "redis://127.0.0.1:6379/1"
  FIREBASE_CERT_PATH: ""

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: pip install -r requirements.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  django-check:
    name: Django system check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Django system checks
        run: python manage.py check

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -q

  jest:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Jest
        run: npm test
