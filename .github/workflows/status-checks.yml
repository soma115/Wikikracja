name: CI / tests & checks

on:
  push:
    branches:
      - main
      - ui
  pull_request:
    branches:
      - main
      - ui
  workflow_dispatch:

env:
  DEBUG: "True"
  SECRET_KEY: "ci-secret-key-for-status-checks"
  LOGGING_DESTINATION: "console"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  REDIS_HOST: "redis://127.0.0.1:6379/1"
  FIREBASE_CERT_PATH: ""

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: pip install -r requirements.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  django-check:
    name: Django system check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Django system checks
        run: python manage.py check

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -q

  jest:
    name: Jest & Tailwind build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check tailwind.build.css is up to date
        run: |
          npm run build:css
          git diff --exit-code home/static/home/css/tailwind.build.css
      - name: Run Jest
        run: npm test

  regression-scan:
    name: Bootstrap regression scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run regression scan
        run: python scripts/regression_scan.py

  ui-guard:
    name: UI unification guard
    runs-on: ubuntu-latest
    # Allowed to fail while historical UI debt is being reduced; review the log.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Fetch base
        run: git fetch origin main
      - name: Run UI guard on changed files
        run: python scripts/ui_guard.py --base origin/main

  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare database and e2e user
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-secret-key-for-status-checks"
          REDIS_HOST: "redis://127.0.0.1:6379/1"
          EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
          FIREBASE_CERT_PATH: ""
        run: |
          python manage.py migrate
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from allauth.account.models import EmailAddress
          from obywatele.models import Uzytkownik
          User = get_user_model()
          u, _ = User.objects.get_or_create(
              username='e2e',
              defaults={
                  'email': 'e2e@example.com',
                  'is_staff': True,
                  'is_superuser': True,
                  'is_active': True,
                  'first_name': 'E2E',
                  'last_name': 'Test',
              },
          )
          u.set_password('e2e-test-pass-123')
          u.save()
          Uzytkownik.objects.update_or_create(uid=u, defaults={'onboarding_status': 'form_completed'})
          EmailAddress.objects.update_or_create(
              user=u,
              email=u.email,
              defaults={'verified': True, 'primary': True},
          )
          PY
          echo "E2E_EMAIL=e2e@example.com" > .env.local
          echo "E2E_PASSWORD=e2e-test-pass-123" >> .env.local
      - name: Start Django server
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-secret-key-for-status-checks"
          REDIS_HOST: "redis://127.0.0.1:6379/1"
          EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
          FIREBASE_CERT_PATH: ""
        run: |
          python manage.py runserver 0.0.0.0:8000 > /tmp/runserver.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/ > /dev/null; then break; fi
            sleep 1
          done
      - name: Run Playwright tests
        run: npx playwright test
