{% extends "home/base.html" %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block head_title %}{% trans "Change password" %}{% endblock %}

{% block content %}
  <h4 class="title">{% trans "Change password" %}</h4>

  <form method="POST" action="{% url 'account_change_password' %}" class="tw-container tw-my-4 tw-w-full tw-max-w-md">
    {% csrf_token %}
    <div class="tw-mb-3">
      {{ form|crispy }}
    </div>
    <button type="submit" name="action" class="tw-btn tw-btn-danger tw-btn-sm"><i class="fas fa-key fa-fw tw-me-1"></i>{% trans "Change password" %}</button>
    <a href="{% url 'account_reset_password' %}" class="tw-btn tw-btn-outline-secondary tw-btn-sm tw-ms-2"><i class="fas fa-key fa-fw tw-me-1"></i>{% trans "Forgot Password?" %}</a>
  </form>
{% endblock %}
