{% extends "home/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Set Password" %}{% endblock %}

{% block content %}
  <h1>{% trans "Set Password" %}</h1>

  <form method="POST" action="{% url 'account_set_password' %}" class="password_set">
    {% csrf_token %}
    <div class="tw-mb-3">
      {{ form.as_p }}
    </div>
    <button type="submit" name="action" class="tw-btn tw-btn-primary tw-btn-sm"><i class="fas fa-check fa-fw tw-me-1"></i>{% trans 'Set Password' %}</button>
  </form>
{% endblock %}
