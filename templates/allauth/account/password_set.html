{% extends "home/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Set Password" %}{% endblock %}

{% block content %}
  <h1>{% trans "Set Password" %}</h1>

  <form method="POST" action="{% url 'account_set_password' %}" class="password_set">
    {% csrf_token %}
    <div class="tw-mb-3">
      {{ form.as_p }}
    </div>
    <input type="submit" name="action" value="{% trans 'Set Password' %}" class="tw-btn tw-btn-primary tw-btn-sm">
  </form>
{% endblock %}
