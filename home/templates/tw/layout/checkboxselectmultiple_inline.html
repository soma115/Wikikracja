{% load crispy_classmap %}
{% if field.is_hidden %}
    {{ field }}
{% else %}
    <div id="div_{{ field.auto_id }}" class="tw-mb-3{% if wrapper_class %} {{ wrapper_class|crispy_classmap }}{% endif %}{% if field.css_classes %} {{ field.css_classes|crispy_classmap }}{% endif %}">

        {% if field.label %}
            <fieldset{% if field.aria_describedby %} aria-describedby="{{ field.aria_describedby }}"{% endif %}>
            <legend for="{{ field.id_for_label }}"  class="{{ label_class|crispy_classmap }} tw-text-base tw-form-label{% if field.field.required %} requiredField{% endif %}">
                {{ field.label }}{% if field.field.required %}<span class="asteriskField">*</span>{% endif %}
            </legend>
        {% endif %}

        {% include 'tw/layout/radio_checkbox_select.html' %}
        {% if field.label %}</fieldset>{% endif %}
    </div>
{% endif %}
