<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{ title }}</title>
  <style type="text/css">
    /* Light (default) email theme tokens. Fallback colors are listed first so older
       clients get a readable light design; CSS-variable-capable clients override them. */
    .email-wrapper {
      --email-bg: #f0f2f5;
      --email-card-bg: #ffffff;
      --email-card-border: rgba(0, 0, 0, .1);
      --email-text: #1e2030;
      --email-muted: rgba(0, 0, 0, .55);
      --email-accent: #059984;
      --email-accent-hover: #047a6a;
      --email-accent-text: #111111;
      --email-inverse: #ffffff;
      --email-item-border: rgba(0, 0, 0, .1);
      --email-link: #047a6a;
      width: 100%;
      background-color: #f0f2f5;
      background-color: var(--email-bg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Explicit dark theme */
    .email-wrapper[data-theme="dark"] {
      --email-bg: #161b2e;
      --email-card-bg: #1e2340;
      --email-card-border: rgba(255, 255, 255, .08);
      --email-text: #e8eaf0;
      --email-muted: rgb(232, 234, 240);
      --email-accent: #00d1b2;
      --email-accent-hover: #00b09b;
      --email-accent-text: #111111;
      --email-inverse: #ffffff;
      --email-item-border: rgba(255, 255, 255, .08);
      --email-link: #00d1b2;
    }

    /* Auto: follow the mail client or system color scheme */
    @media (prefers-color-scheme: dark) {
      .email-wrapper[data-theme="auto"] {
        --email-bg: #161b2e;
        --email-card-bg: #1e2340;
        --email-card-border: rgba(255, 255, 255, .08);
        --email-text: #e8eaf0;
        --email-muted: rgb(232, 234, 240);
        --email-accent: #00d1b2;
        --email-accent-hover: #00b09b;
        --email-accent-text: #111111;
        --email-inverse: #ffffff;
        --email-item-border: rgba(255, 255, 255, .08);
        --email-link: #00d1b2;
      }
    }

    .email-body { margin: 0; padding: 0; }

    .email-container { padding: 40px 16px; }

    .email-card {
      max-width: 600px;
      width: 100%;
      border-radius: 0.9rem;
      overflow: hidden;
      background-color: #ffffff;
      background-color: var(--email-card-bg);
      color: #1e2030;
      color: var(--email-text);
      border: 1px solid rgba(0, 0, 0, .1);
      border: 1px solid var(--email-card-border);
      box-shadow: 0 12px 32px rgba(30, 32, 48, .12);
    }

    .email-wrapper[data-theme="dark"] .email-card,
    .email-wrapper[data-theme="auto"] .email-card {
      background-color: #1e2340;
      background-color: var(--email-card-bg);
      color: #e8eaf0;
      color: var(--email-text);
      border-color: rgba(255, 255, 255, .08);
      border-color: var(--email-card-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
    }

    .email-header {
      padding: 32px 32px 0;
      color: #1e2030;
      color: var(--email-text);
    }

    .email-header-panel {
      padding: 22px 24px;
      background-color: #eef0ff;
      border-radius: 0.45rem;
      color: #1e2030;
      color: var(--email-text);
    }

    .email-header-panel a {
      color: #37306b !important;
      text-decoration: none !important;
    }

    .email-wrapper[data-theme="dark"] .email-header-panel,
    .email-wrapper[data-theme="auto"] .email-header-panel {
      background-color: #2d3154;
      color: #e8eaf0;
      color: var(--email-text);
    }

    .email-kicker { margin: 0 0 12px; font-size: 20px; font-weight: 700; line-height: 1.3; color: #37306b; }
    .email-title { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.25; color: #1e2030; color: var(--email-text); }

    .email-content { padding: 32px 32px 12px; }

    .email-intro-panel {
      margin: 0 0 30px;
      padding: 16px 18px;
      background-color: #e8f7f4;
      border-left: 4px solid #059984;
      border-radius: 0.45rem;
    }

    .email-wrapper[data-theme="dark"] .email-intro-panel,
    .email-wrapper[data-theme="auto"] .email-intro-panel {
      background-color: #203d3d;
      border-left-color: #00d1b2;
    }

    .email-critical {
      margin: 0 0 28px;
      padding: 16px 18px;
      color: #8b0000;
      background-color: #fff1f1;
      border: 2px solid #c62828;
      border-radius: 0.45rem;
    }

    .email-critical-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 700;
      color: #b71c1c;
    }

    .email-critical-item {
      margin: 8px 0 0;
    }

    .email-critical-item a {
      color: #b71c1c;
      font-weight: 700;
    }

    .email-intro {
      margin: 0;
      color: rgba(0, 0, 0, .55);
      color: var(--email-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .email-wrapper[data-theme="dark"] .email-intro,
    .email-wrapper[data-theme="auto"] .email-intro {
      color: rgb(232, 234, 240);
      color: var(--email-muted);
    }

    .email-section-title {
      margin: 30px 0 14px;
      padding-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #059984;
      color: var(--email-accent);
      border-bottom: 1px solid rgba(0, 0, 0, .1);
      border-bottom: 1px solid var(--email-item-border);
    }

    .email-wrapper[data-theme="dark"] .email-section-title,
    .email-wrapper[data-theme="auto"] .email-section-title {
      color: #00d1b2;
      color: var(--email-accent);
      border-color: rgba(255, 255, 255, .08);
      border-color: var(--email-item-border);
    }

    .email-item {
      margin-bottom: 12px;
      padding: 15px 16px;
      border: 1px solid rgba(0, 0, 0, .08);
      border: 1px solid var(--email-item-border);
      border-left: 3px solid #059984;
      border-left-color: var(--email-accent);
      border-radius: 0.45rem;
      background-color: #fbfcfc;
    }

    .email-wrapper[data-theme="dark"] .email-item,
    .email-wrapper[data-theme="auto"] .email-item {
      border-color: rgba(255, 255, 255, .08);
      border-left-color: var(--email-accent);
      background-color: #242a47;
    }

    .email-item-title {
      color: #047a6a;
      color: var(--email-link);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }

    .email-wrapper[data-theme="dark"] .email-item-title,
    .email-wrapper[data-theme="auto"] .email-item-title {
      color: #00d1b2;
      color: var(--email-link);
    }

    .email-item-meta {
      color: rgba(0, 0, 0, .55);
      color: var(--email-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .email-wrapper[data-theme="dark"] .email-item-meta,
    .email-wrapper[data-theme="auto"] .email-item-meta {
      color: rgb(232, 234, 240);
      color: var(--email-muted);
    }

    .email-item-count {
      color: rgba(0, 0, 0, .55);
      color: var(--email-muted);
      font-size: 13px;
    }

    .email-wrapper[data-theme="dark"] .email-item-count,
    .email-wrapper[data-theme="auto"] .email-item-count {
      color: rgb(232, 234, 240);
      color: var(--email-muted);
    }

    .email-item-desc {
      margin: 8px 0 0;
      color: #1e2030;
      color: var(--email-text);
      font-size: 14px;
      line-height: 1.5;
    }

    .email-wrapper[data-theme="dark"] .email-item-desc,
    .email-wrapper[data-theme="auto"] .email-item-desc {
      color: #e8eaf0;
      color: var(--email-text);
    }

    .email-footer {
      padding: 24px 32px 28px;
      text-align: center;
      border-top: 1px solid rgba(0, 0, 0, .1);
      border-top: 1px solid var(--email-item-border);
    }

    .email-wrapper[data-theme="dark"] .email-footer,
    .email-wrapper[data-theme="auto"] .email-footer {
      border-color: rgba(255, 255, 255, .08);
      border-color: var(--email-item-border);
    }

    .email-button {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 0.45rem;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      background-color: #047a6a;
      background-color: var(--email-accent-hover, #047a6a);
      color: #ffffff;
      color: var(--email-inverse, #ffffff) !important;
    }

    .email-wrapper[data-theme="dark"] .email-button,
    .email-wrapper[data-theme="auto"] .email-button {
      background-color: #00b09b;
      background-color: var(--email-accent-hover, #00b09b);
      color: #ffffff;
      color: var(--email-inverse, #ffffff) !important;
    }

    .email-footer-text {
      margin: 18px 0 0;
      font-size: 12px;
      color: rgba(0, 0, 0, .55);
      color: var(--email-muted);
    }

    .email-footer-url {
      margin-top: 2px;
    }

    .email-wrapper[data-theme="dark"] .email-footer-text,
    .email-wrapper[data-theme="auto"] .email-footer-text {
      color: rgb(232, 234, 240);
      color: var(--email-muted);
    }

    .email-footer-link {
      color: #1e2030;
      color: var(--email-text);
      text-decoration: underline;
    }

    .email-wrapper[data-theme="dark"] .email-footer-link,
    .email-wrapper[data-theme="auto"] .email-footer-link {
      color: #e8eaf0;
      color: var(--email-text);
    }

    @media only screen and (max-width: 620px) {
      .email-container { padding: 20px 10px; }
      .email-header { padding: 24px 20px 0; }
      .email-content { padding: 24px 20px 8px; }
      .email-footer { padding: 20px 20px 24px; }
      .email-title { font-size: 23px; }
    }
  </style>
</head>
<body class="email-body">
  <table class="email-wrapper" data-theme="{{ theme }}" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td class="email-container" align="center">
        <table class="email-card" role="presentation" width="600" cellspacing="0" cellpadding="0" border="0">
          <tr>
            <td class="email-header">
              <div class="email-header-panel">
                <p class="email-kicker">{{ site_name }}</p>
                <h1 class="email-title">{{ title }}</h1>
              </div>
            </td>
          </tr>
          <tr>
            <td class="email-content">
              {% if restarted_votes %}
              <div class="email-critical">
                <p class="email-critical-title">{{ restarted_votes_title }}</p>
                <div>{{ restarted_votes_intro }}</div>
                {% for vote in restarted_votes %}
                <div class="email-critical-item">&bull; <a href="{{ vote.url }}">{{ vote.title }}</a></div>
                {% endfor %}
              </div>
              {% endif %}

              <div class="email-intro-panel">
                <p class="email-intro">{{ digest_intro }}</p>
              </div>

              {{ sections_html }}
            </td>
          </tr>
          <tr>
            <td class="email-footer">
              <a class="email-button" href="{{ settings_url }}">{{ manage_button_text }}</a>
              <p class="email-footer-text">{{ manage_text }}</p>
              <p class="email-footer-text email-footer-url"><a class="email-footer-link" href="{{ settings_url }}">{{ settings_url }}</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
