{% load i18n %}
<{% if module.url %}a href="{% url module.url %}"{% else %}div{% endif %} class="tw-card tw-h-full{% if module.url %} tw-no-underline{% endif %}">
  <div class="tw-card-body">
    <h6 class="tw-mb-1 tw-text-accent"><i class="fas {{ module.icon }} tw-me-2"></i>{{ module.name }}</h6>
    <p class="tw-mb-0 tw-text-sm">{{ module.description }}</p>
  </div>
</{% if module.url %}a{% else %}div{% endif %}>
