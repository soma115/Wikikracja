repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: regression-scan
        name: Bootstrap / UI regression scan
        entry: python scripts/regression_scan.py
        language: system
        pass_filenames: false
      - id: ui-guard
        name: UI unification guard
        entry: python scripts/ui_guard.py
        language: system
        pass_filenames: false
