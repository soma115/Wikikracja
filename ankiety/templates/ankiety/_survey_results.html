{% load i18n %}
{% load l10n %}
{% for option in options %}
  <div class="tw-mb-2">
    <div class="tw-flex tw-justify-between tw-text-sm">
      <span>
        {{ option.text }}
        {% if option.created_by %}<i class="fas fa-user-plus tw-text-muted tw-ms-1" title="{% trans 'Added by a participant' %}" aria-label="{% trans 'Added by a participant' %}"></i>{% endif %}
      </span>
      <span>
        <strong class="tw-font-semibold">{{ option.vote_count }}</strong>
        {% if total_votes %}
          <span class="tw-text-muted">({{ option.percentage }}%)</span>
        {% endif %}
      </span>
    </div>
    <div class="tw-result-bar-track tw-w-full"><div class="tw-result-bar-fill" data-progress="{{ option.percentage|unlocalize }}"></div></div>
  </div>
{% empty %}
  <p class="tw-text-muted tw-text-sm tw-mb-0">{% trans 'No options' %}</p>
{% endfor %}
