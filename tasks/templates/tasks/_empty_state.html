{% load i18n %}

<div class="tasks-empty">
  <i class="fas {{ icon|default:'fa-inbox' }} fa-2x"></i>
  <div>
    {% if current_categories %}
      {% trans 'No tasks in this category.' %}
    {% else %}
      {% trans 'No tasks in this section.' %}
    {% endif %}
  </div>
  <div>{% trans 'Try changing the filter settings to see tasks if there are any.' %}</div>
</div>
