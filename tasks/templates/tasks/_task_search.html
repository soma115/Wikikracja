{% load i18n %}
<form method="get" class="tw-flex-1 tw-min-w-0">
  <input type="hidden" name="tab" value="{{ current_tab }}">
  <input type="hidden" name="sort" value="{{ current_sort }}">
  <input type="hidden" name="order" value="{{ current_order }}">
  {% for category in current_categories %}<input type="hidden" name="category" value="{{ category }}">{% endfor %}
  <input type="search" name="q" value="{{ search_query }}" class="tw-form-control tw-w-full" placeholder="{% trans 'Search' %}" aria-label="{% trans 'Search' %}">
</form>
