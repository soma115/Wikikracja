{% load i18n %}
<article class="tw-flex tw-flex-col sm:tw-flex-row tw-items-start tw-justify-between tw-gap-3 tw-border tw-border-subtle tw-rounded-card tw-p-3">
  <div class="tw-min-w-0">
    <div class="tw-font-semibold tw-break-words">
      {{ listing.name }}
      <span class="tw-badge-status tw-badge-info">{{ listing.get_kind_display }}</span>
      {% if listing.is_closed %}<span class="tw-badge-status tw-badge-warning"><i class="fas fa-archive fa-fw" aria-hidden="true"></i>{% trans "Archive" %}</span>{% endif %}
    </div>
    {% if listing.description %}<p class="tw-mt-1 tw-mb-0 tw-text-sm tw-text-muted">{{ listing.description|urlize|linebreaksbr }}</p>{% endif %}
  </div>
  <div class="tw-flex tw-flex-wrap tw-justify-end tw-gap-2 tw-w-full sm:tw-w-auto sm:tw-shrink-0">
    <a href="{% url 'bookkeeping:resource_update' pk=listing.pk %}#resource-form" class="tw-btn tw-btn-sm tw-btn-secondary" title="{% trans 'Edit' %}" aria-label="{% trans 'Edit' %}"><i class="fas fa-pen fa-fw" aria-hidden="true"></i>{% trans 'Edit' %}</a>
    <form method="post" action="{% url 'bookkeeping:resource_toggle_closed' pk=listing.pk %}">
      {% csrf_token %}
      <input type="hidden" name="closed" value="{% if listing.is_closed %}0{% else %}1{% endif %}">
      <button type="submit" class="tw-btn tw-btn-sm tw-btn-outline-secondary">
        {% if listing.is_closed %}<i class="fas fa-rotate-left fa-fw" aria-hidden="true"></i>{% trans "Restore" %}{% else %}<i class="fas fa-lock fa-fw" aria-hidden="true"></i>{% trans "Close" %}{% endif %}
      </button>
    </form>
    <form method="post" action="{% url 'bookkeeping:resource_delete' pk=listing.pk %}">
      {% csrf_token %}
      <button type="submit" class="tw-btn tw-btn-sm tw-btn-outline-danger">{% trans 'Delete' %}</button>
    </form>
  </div>
</article>
