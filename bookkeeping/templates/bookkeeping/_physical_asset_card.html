{% load i18n %}

<div class="tw-content-card">
  <div class="tw-content-card-header"
       data-detail-url="{% url 'bookkeeping:physical_asset_detail' physical_asset.pk %}"
       role="link"
       tabindex="0">
    <div class="tw-content-card-title-row">
      <span class="tw-proposal-card-num">#{{ physical_asset.pk }}</span>
      <span class="tw-content-card-title">{{ physical_asset.name }}</span>
    </div>
    <div class="tw-content-card-meta">
      <span class="tw-whitespace-nowrap"><i class="fas fa-map-marker-alt fa-fw"></i> {{ physical_asset.city }}</span>
      <span class="tw-badge tw-badge-secondary">{{ physical_asset.country.name }}</span>
    </div>
  </div>

  {% if physical_asset.street or physical_asset.house_number %}
    <div class="tw-content-card-body" data-view-only="grid">
      <div class="tw-proposal-section--law">
        <div class="tw-proposal-section-label"><i class="fas fa-map-marker-alt fa-fw"></i> {% trans 'Address' %}</div>
        <div class="tw-proposal-section-text">
          {{ physical_asset.street }} {{ physical_asset.house_number }}
        </div>
      </div>
    </div>
  {% endif %}
</div>
