{% load i18n %}
<form method="get" class="tw-w-full" data-restore-search-focus>
  <input id="transaction-search" type="search" name="q" value="{{ search_query }}" class="tw-form-control tw-w-full" placeholder="{% trans 'Search all fields...' %}" aria-label="{% trans 'Search all fields...' %}">
  {% for category_id in current_categories %}<input type="hidden" name="category" value="{{ category_id }}">{% endfor %}
  <input type="hidden" name="sort" value="{{ current_sort }}">
  {% if current_order %}<input type="hidden" name="order" value="{{ current_order }}">{% endif %}
</form>
