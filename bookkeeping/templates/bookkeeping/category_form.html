{% extends 'bookkeeping/menu.html' %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block bookkeeping %}
<div class="tw-container tw-my-4">

  <div class="tw-card">
    <div class="tw-card-body">
      <form method="post">
        {% csrf_token %}

        <div class="tw-form-actions tw-form-actions--top">
          <a href="{% url 'bookkeeping:category_list' %}" class="tw-btn tw-btn-secondary tw-form-action-btn" data-autosave-clear title="{% trans 'Cancel' %}" aria-label="{% trans 'Cancel' %}"><i class="fas fa-rotate-left fa-fw" aria-hidden="true"></i>{% trans "Cancel" %}</a>
          <button type="submit" class="tw-btn tw-btn-primary tw-form-action-btn" title="{% trans 'Save Category' %}" aria-label="{% trans 'Save Category' %}"><i class="fas fa-floppy-disk fa-fw" aria-hidden="true"></i>{% trans "Save Category" %}</button>
        </div>

        <div class="tw-card tw-mb-3">
          <div class="tw-card-header">
            <h4>{% if form.instance.pk %} {% trans "Update Category" %} {% else %} {% trans "New category" %} {% endif %}</h4>
          </div>
          <div class="tw-card-body">
            <div class="tw-grid tw-grid-cols-12 tw-gap-3">
              <div class="tw-col-span-12">
                {{ form.name|as_crispy_field }}
              </div>
            </div>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
