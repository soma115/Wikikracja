{% extends 'bookkeeping/menu.html' %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block bookkeeping %}
<div class="tw-container tw-mt-4">

  <div class="tw-card">
    <div class="tw-card-body">
      <form method="post">
        {% csrf_token %}

        <div class="tw-card tw-mb-3">
          <div class="tw-card-header tw-bg-info tw-text-white">
            <h4>{% if form.instance.pk %} {% trans "Update Category" %} {% else %} {% trans "New category" %} {% endif %}</h4>
          </div>
          <div class="tw-card-body">
            <div class="tw-grid tw-grid-cols-12 tw-gap-3">
              <div class="tw-col-span-12">
                {{ form.name|as_crispy_field }}
              </div>
            </div>
          </div>
        </div>

        <div class="tw-mb-3">
          <button type="submit" class="tw-btn tw-btn-primary"><i class="fas fa-check fa-fw tw-me-1"></i>{% trans "Save Category" %}</button>
          <a href="{% url 'bookkeeping:category_list' %}" class="tw-btn tw-btn-secondary"><i class="fas fa-times fa-fw tw-me-1"></i>{% trans "Cancel" %}</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
