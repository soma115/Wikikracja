{% extends 'obywatele/menu.html' %}
{% load static %}
{% load i18n %}
{% load render_table from django_tables2 %}
{% load crispy_forms_tags %}

{% block citizens %}
<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="section-heading">{% trans "Resources" %}</span>
    <div class="d-flex gap-2 align-items-center">
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          {% trans "Columns" %}
        </button>
        <div class="dropdown-menu p-3" id="column-toggle-menu">
          <h6 class="dropdown-header">{% trans "Visible columns" %}</h6>
          <div id="column-checkboxes"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body p-0">
    <div class="p-3 border-bottom">
      <input type="text" id="global-search" class="form-control" placeholder="{% trans 'Search all fields...' %}">
    </div>
    <div class="table-responsive">
      {% render_table table %}
    </div>
  </div>
</div>

<script src="{% static 'obywatele/js/assets-column-toggle.js' %}"></script>
{% endblock citizens %}
