{% load i18n %}
<div class="tw-detail-nav tw-flex tw-flex-wrap tw-gap-1">
  {% if active %}
    {% if next %}
      <a href="{% url 'obywatele:obywatele_szczegoly' pk=next.id %}{% if sort_param %}?{{ sort_param }}{% endif %}" class="tw-detail-nav-btn" title="{% trans 'Previous' %}" aria-label="{% trans 'Previous' %}"><i class="fas fa-chevron-left fa-fw" aria-hidden="true"></i></a>
    {% else %}
      <span class="tw-detail-nav-btn tw-disabled" aria-disabled="true" aria-label="{% trans 'Previous' %}"><i class="fas fa-chevron-left fa-fw" aria-hidden="true"></i></span>
    {% endif %}
    {% if prev %}
      <a href="{% url 'obywatele:obywatele_szczegoly' pk=prev.id %}{% if sort_param %}?{{ sort_param }}{% endif %}" class="tw-detail-nav-btn" title="{% trans 'Next' %}" aria-label="{% trans 'Next' %}"><i class="fas fa-chevron-right fa-fw" aria-hidden="true"></i></a>
    {% else %}
      <span class="tw-detail-nav-btn tw-disabled" aria-disabled="true" aria-label="{% trans 'Next' %}"><i class="fas fa-chevron-right fa-fw" aria-hidden="true"></i></span>
    {% endif %}
  {% else %}
    {% if next %}
      <a href="{% url 'obywatele:poczekalnia_szczegoly' pk=next.id %}{% if sort_param %}?{{ sort_param }}{% endif %}" class="tw-detail-nav-btn" title="{% trans 'Previous' %}" aria-label="{% trans 'Previous' %}"><i class="fas fa-chevron-left fa-fw" aria-hidden="true"></i></a>
    {% else %}
      <span class="tw-detail-nav-btn tw-disabled" aria-disabled="true" aria-label="{% trans 'Previous' %}"><i class="fas fa-chevron-left fa-fw" aria-hidden="true"></i></span>
    {% endif %}
    {% if prev %}
      <a href="{% url 'obywatele:poczekalnia_szczegoly' pk=prev.id %}{% if sort_param %}?{{ sort_param }}{% endif %}" class="tw-detail-nav-btn" title="{% trans 'Next' %}" aria-label="{% trans 'Next' %}"><i class="fas fa-chevron-right fa-fw" aria-hidden="true"></i></a>
    {% else %}
      <span class="tw-detail-nav-btn tw-disabled" aria-disabled="true" aria-label="{% trans 'Next' %}"><i class="fas fa-chevron-right fa-fw" aria-hidden="true"></i></span>
    {% endif %}
  {% endif %}
</div>
