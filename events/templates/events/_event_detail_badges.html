{% load i18n %}
<div class="tw-detail-meta">
  <span class="tw-detail-meta-item" title="{% trans 'Frequency' %}">
    <i class="fas fa-{% if event.frequency == 'once' %}calendar-day{% else %}repeat{% endif %} tw-detail-meta-icon" aria-hidden="true"></i>
    <span class="tw-detail-meta-label">{% trans "Frequency" %}</span>
    <strong class="tw-detail-meta-value">{{ event.get_frequency_display }}</strong>
  </span>
  <span class="tw-detail-meta-item" title="{% if event.is_active %}{% trans 'Active' %}{% else %}{% trans 'Inactive' %}{% endif %}">
    <i class="fas {% if event.is_active %}fa-check-circle{% else %}fa-times-circle{% endif %} tw-detail-meta-icon" aria-hidden="true"></i>
    <span class="tw-detail-meta-label">{% trans "Status" %}</span>
    <strong class="tw-detail-meta-value"><span class="tw-badge-status tw-badge-{% if event.is_active %}approved{% else %}rejected{% endif %}">{% if event.is_active %}{% trans "Active" %}{% else %}{% trans "Inactive" %}{% endif %}</span></strong>
  </span>
  <span class="tw-detail-meta-item" title="{% if event.is_public %}{% trans 'Visible to everyone' %}{% else %}{% trans 'Visible only to logged-in users' %}{% endif %}">
    <i class="fas {% if event.is_public %}fa-globe{% else %}fa-lock{% endif %} tw-detail-meta-icon" aria-hidden="true"></i>
    <span class="tw-detail-meta-label">{% if event.is_public %}{% trans "Public" %}{% else %}{% trans "Private" %}{% endif %}</span>
  </span>
</div>
