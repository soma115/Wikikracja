{% load i18n %}
{% if user.is_authenticated %}
<div class="tw-detail-nav tw-flex tw-gap-1">
  <a href="{% url 'events:delete' event.pk %}" class="tw-detail-nav-btn tw-text-danger" title="{% trans 'Delete' %}" aria-label="{% trans 'Delete' %}">
    <i class="fas fa-trash fa-fw" aria-hidden="true"></i>
  </a>
  <a href="{% url 'events:edit' event.pk %}" class="tw-detail-nav-btn" title="{% trans 'Edit' %}" aria-label="{% trans 'Edit' %}">
    <i class="fas fa-pen fa-fw" aria-hidden="true"></i>
  </a>
</div>
{% endif %}
